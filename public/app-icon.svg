<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#69177f"/>
      <stop offset="60%" stop-color="#49105f"/>
      <stop offset="100%" stop-color="#340945"/>
    </radialGradient>
    <radialGradient id="flowerCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="250" cy="250" r="246" fill="url(#bg)"/>

  <!-- Subtle watermark Thai letters in background -->
  <g fill="#5a1571" opacity="0.35" font-family="'Noto Sans Thai', sans-serif" font-weight="900">
    <text x="70" y="110" font-size="54">ก</text>
    <text x="180" y="90" font-size="44">ข</text>
    <text x="320" y="100" font-size="50">ณ</text>
    <text x="410" y="150" font-size="42">ด</text>
    <text x="60" y="240" font-size="48">ถ</text>
    <text x="400" y="270" font-size="52">ท</text>
    <text x="80" y="380" font-size="46">บ</text>
    <text x="180" y="440" font-size="48">พ</text>
    <text x="310" y="420" font-size="50">ม</text>
    <text x="410" y="390" font-size="46">ย</text>
    <text x="250" y="460" font-size="42">ว</text>
    <text x="240" y="130" font-size="38">ห</text>
  </g>

  <!-- White Plumeria / Frangipani Flower -->
  <g transform="translate(130, 185) scale(0.72)" filter="url(#shadow)">
    <!-- 5 Petals -->
    <path d="M 0,-15 C -25,-60 25,-60 0,-15" fill="#fdfcf8" transform="rotate(0)"/>
    <ellipse cx="0" cy="-45" rx="26" ry="42" fill="#fffef9" transform="rotate(0)"/>
    <ellipse cx="0" cy="-45" rx="26" ry="42" fill="#fffef9" transform="rotate(72)"/>
    <ellipse cx="0" cy="-45" rx="26" ry="42" fill="#fffef9" transform="rotate(144)"/>
    <ellipse cx="0" cy="-45" rx="26" ry="42" fill="#fffef9" transform="rotate(216)"/>
    <ellipse cx="0" cy="-45" rx="26" ry="42" fill="#fffef9" transform="rotate(288)"/>
    <!-- Petal overlays with soft warm tones -->
    <circle cx="0" cy="0" r="26" fill="url(#flowerCenter)"/>
    <circle cx="0" cy="0" r="10" fill="#f57f17"/>
  </g>

  <!-- Yellow Stylized Script "သူ့ဇာဝ" / ThaiSar -->
  <g fill="#fff000" stroke="#f6dc00" stroke-width="1.5" filter="url(#shadow)">
    <!-- Letter 1 (left loop with diacritic foot) -->
    <path d="M 75,255 C 65,225 90,205 125,215 C 145,222 155,245 150,265 C 145,285 130,295 105,290 C 85,285 75,270 75,255 Z
             M 95,255 C 95,268 115,272 125,260 C 135,248 128,235 115,232 C 102,230 95,240 95,255 Z"/>
    <path d="M 125,290 Q 125,360 135,365 Q 148,370 155,355 Q 160,345 145,345 Q 137,345 137,290 Z"/>
    
    <!-- Letter 2 (middle flourish upward) -->
    <path d="M 175,255 C 165,225 195,200 230,215 C 248,223 255,245 250,268 C 245,288 225,298 200,290 C 180,283 175,268 175,255 Z
             M 195,255 C 195,270 218,272 228,258 C 238,245 230,230 215,228 C 200,226 195,240 195,255 Z"/>
    <!-- Tall curved accent -->
    <path d="M 235,210 Q 245,150 255,140 Q 260,135 250,165 Q 240,195 242,215 Z"/>

    <!-- Letter 3 (twin rounded curves) -->
    <path d="M 270,250 C 265,235 275,225 290,230 C 300,235 300,255 292,265 C 285,272 272,268 270,250 Z"/>
    <path d="M 305,250 C 300,235 310,225 325,230 C 335,235 335,255 327,265 C 320,272 307,268 305,250 Z"/>

    <!-- Letter 4 (right loop and outer hook) -->
    <path d="M 345,255 C 335,225 365,205 400,215 C 420,222 430,245 425,268 C 420,290 398,298 375,290 C 355,283 345,270 345,255 Z
             M 365,255 C 365,270 388,272 398,258 C 408,245 400,230 385,228 C 370,226 365,240 365,255 Z"/>
    <path d="M 425,230 Q 445,245 440,275 Q 435,295 415,290 Q 430,275 425,250 Z"/>
  </g>
</svg>
